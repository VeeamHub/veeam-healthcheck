name: Semgrep Scan

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches:
      - master
      - dev

jobs:
  semgrep:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2

    - name: Set up Python
      uses: actions/setup-python@e9aba2c848f5ebd159c070c61ea2c4e2b122355e # v2
      with:
        python-version: '3.x'

    - name: Install Semgrep
      run: pip install semgrep

    # The engine is occasionally killed for running out of memory on the runner
    # ("semgrep-core exited with unexpected output", exit 2). Fewer parallel jobs
    # and a per-file memory cap keep it inside the runner's RAM.
    - name: Run Semgrep
      run: semgrep --config auto --error --jobs 2 --max-memory 4000

    - name: SemGrep SupplyChain
      run: semgrep --config "p/supply-chain" --jobs 2 --max-memory 4000
