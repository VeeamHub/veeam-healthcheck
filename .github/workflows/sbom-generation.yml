name: Generate SBOM

on:
  release:
    types: [published, created]
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  sbom:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore vHC/HC.sln

      - name: Install CycloneDX tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM (CycloneDX JSON)
        run: |
          New-Item -ItemType Directory -Force -Path sbom
          dotnet CycloneDX vHC/HC.sln -o sbom/ -fn VeeamHealthCheck-SBOM.json -F Json

      - name: Generate SBOM (CycloneDX XML)
        run: |
          dotnet CycloneDX vHC/HC.sln -o sbom/ -fn VeeamHealthCheck-SBOM.xml -F Xml

      - name: Get version
        id: get_version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:EVENT_NAME -eq 'release') {
            # The release already has its version; do not compute a different one.
            $version = $env:RELEASE_TAG.TrimStart('v')
          } else {
            $revision = gh run list --workflow ci-cd.yaml --limit 1 --json number --jq '.[0].number'
            if (-not $revision) { throw 'Could not read the latest ci-cd.yaml run number.' }
            $info = ./.github/scripts/Get-VhcVersion.ps1 -Revision ([int]$revision) -Channel ga
            $version = $info.Version
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $version"

      - name: Create SBOM summary
        run: |
          echo "## 📋 Software Bill of Materials (SBOM)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get_version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          echo "**Format:** CycloneDX 1.4" >> $env:GITHUB_STEP_SUMMARY
          echo "**Generated:** $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          
          if (Test-Path sbom/VeeamHealthCheck-SBOM.json) {
            $sbom = Get-Content sbom/VeeamHealthCheck-SBOM.json | ConvertFrom-Json
            $componentCount = $sbom.components.Count
            echo "**Total Components:** $componentCount" >> $env:GITHUB_STEP_SUMMARY
            echo "" >> $env:GITHUB_STEP_SUMMARY
            echo "### Direct Dependencies" >> $env:GITHUB_STEP_SUMMARY
            echo "" >> $env:GITHUB_STEP_SUMMARY
            
            $sbom.components | Where-Object { $_.scope -eq 'required' } | Select-Object -First 10 | ForEach-Object {
              echo "- $($_.name) $($_.version)" >> $env:GITHUB_STEP_SUMMARY
            }
          }

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-v${{ steps.get_version.outputs.version }}
          path: |
            sbom/VeeamHealthCheck-SBOM.json
            sbom/VeeamHealthCheck-SBOM.xml
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            sbom/VeeamHealthCheck-SBOM.json
            sbom/VeeamHealthCheck-SBOM.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
