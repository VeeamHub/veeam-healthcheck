name: Pester Tests (Windows)

# Runs every *.Tests.ps1 tracked in the repo (discovered by glob, so new test
# files are picked up automatically).

on:
  push:
    branches: [master, dev]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'vHC/HC_Reporting/Tools/Scripts/**/*.json'
      - 'vHC/HC_Reporting/Tools/Scripts/**/*.csv'
      - 'vHC/HC_Reporting/Functions/Collection/PSCollections/**'
      - '.github/workflows/pester-tests.yml'
  pull_request:
    branches: [master, dev]
    paths:
      - '**/*.ps1'
      - '**/*.psm1'
      - '**/*.psd1'
      - 'vHC/HC_Reporting/Tools/Scripts/**/*.json'
      - 'vHC/HC_Reporting/Tools/Scripts/**/*.csv'
      - 'vHC/HC_Reporting/Functions/Collection/PSCollections/**'
      - '.github/workflows/pester-tests.yml'
  workflow_dispatch:

jobs:
  pester:
    name: Pester — all test files
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ensure Pester v5 is available
        shell: pwsh
        run: |
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge '5.0.0' } | Select-Object -First 1
          if (-not $pester) {
            Write-Host 'Pester v5 not found — installing from PSGallery...'
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          } else {
            Write-Host "Pester $($pester.Version) already available"
          }

      - name: Run Pester tests
        id: pester_run
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0

          # Discover every tracked *.Tests.ps1 (no hard-coded list).
          $testFiles = @(git ls-files '*.Tests.ps1')
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git ls-files failed"
            exit 1
          }
          if ($testFiles.Count -eq 0) {
            Write-Host '::error::No *.Tests.ps1 files found'
            exit 1
          }
          Write-Host "Discovered $($testFiles.Count) test file(s):"
          $testFiles | ForEach-Object { Write-Host "  $_" }
          $testFiles | Out-File -FilePath 'pester-test-files.txt' -Encoding utf8

          $resultsFile = 'pester-results.xml'

          $config = New-PesterConfiguration
          $config.Run.Path = [string[]]$testFiles
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = $resultsFile

          $result = Invoke-Pester -Configuration $config

          # Surface counts for summary step
          "files=$($testFiles.Count)"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "passed=$($result.PassedCount)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "failed=$($result.FailedCount)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "skipped=$($result.SkippedCount)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "total=$($result.TotalCount)"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          if ($result.FailedCount -gt 0 -or $result.FailedBlocksCount -gt 0 -or $result.FailedContainersCount -gt 0) {
            Write-Host "::error::Pester failures: $($result.FailedCount) test(s), $($result.FailedBlocksCount) block(s), $($result.FailedContainersCount) container(s)"
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pester-results-${{ github.run_number }}
          path: |
            pester-results.xml
            pester-test-files.txt
          retention-days: 30

      - name: Write job summary
        if: always()
        shell: pwsh
        run: |
          $files   = '${{ steps.pester_run.outputs.files }}'
          $passed  = '${{ steps.pester_run.outputs.passed }}'
          $failed  = '${{ steps.pester_run.outputs.failed }}'
          $skipped = '${{ steps.pester_run.outputs.skipped }}'
          $total   = '${{ steps.pester_run.outputs.total }}'

          if ('${{ steps.pester_run.outcome }}' -eq 'success') {
            $status = ':white_check_mark: All tests passed'
          } else {
            $status = ':x: Pester run failed (see job log)'
          }

          $fileList = ''
          if (Test-Path 'pester-test-files.txt') {
            $fileList = (Get-Content 'pester-test-files.txt' | ForEach-Object { "- ``$_``" }) -join "`n"
          }

          $summary = @"
          ## Pester Test Results

          **$status**

          | Files | Passed | Failed | Skipped | Total |
          |-------|--------|--------|---------|-------|
          | $files | $passed | $failed | $skipped | $total |

          ### Test files
          $fileList

          > Full NUnit XML results available in the **pester-results-${{ github.run_number }}** artifact.
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
